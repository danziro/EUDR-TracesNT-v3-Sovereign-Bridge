services:
  db:
    image: postgis/postgis:15-3.3
    container_name: eudr_postgis
    restart: always
    # Menulis secara eksplisit agar kebal dari Windows CRLF bug
    environment:
      - POSTGRES_USER=eudr_admin
      - POSTGRES_PASSWORD=secure_password_2026
      - POSTGRES_DB=geoai_eudr_db
    ports:
      - "5434:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  redis:
    image: redis:7-alpine
    container_name: eudr_redis
    restart: always
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5.18.0
    container_name: eudr_neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/secure_graph_password_2026
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eudr_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM1Tk'
    volumes:
      - kafka_data:/var/lib/kafka/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: eudr_fastapi
    restart: always
    # Menghubungkan langsung ke URL yang bersih
    environment:
      - DATABASE_URL=postgresql+asyncpg://eudr_admin:secure_password_2026@db:5432/geoai_eudr_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - neo4j
      - kafka

volumes:
  postgis_data:
  neo4j_data:
  kafka_data: